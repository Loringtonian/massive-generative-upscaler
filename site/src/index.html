<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101113" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{SITE_URL}}" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="stage">
      <div
        id="viewer"
        tabindex="0"
        role="region"
        aria-label="Zoomable image: the original photo on the left of the divider, the restored image on the right"
      ></div>
      <canvas id="before" aria-hidden="true"></canvas>

      <div id="divider" role="slider" tabindex="0" aria-label="Divider between original and restored" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10">
        <span id="handle" aria-hidden="true">‹ ›</span>
      </div>

      <button id="fullscreen" class="glass" hidden aria-label="Fullscreen" title="Fullscreen">⛶</button>

      <section id="panel" class="glass" aria-label="Options">
        <label class="check"><input type="checkbox" id="smoothing" /><span>Pixel smoothing</span></label>
        <label class="check"><input type="checkbox" id="get-yours" aria-controls="actions" /><span>Get yours</span></label>
        <div id="actions" hidden>
          <div class="action download">
            <span class="action-label">Download</span>
            <span class="chips">
              <a id="dl-jpeg" class="chip" download>JPEG · <span data-mb="jpeg"></span> MB</a>
              <a id="dl-tiff" class="chip" download>TIFF · <span data-mb="tiff"></span> MB</a>
            </span>
          </div>
          <div id="human-check" hidden></div>
          <a id="tip" class="action" target="_blank" rel="noopener noreferrer"><span>{{TIP_LABEL}}</span></a>
          <a id="print" class="action" aria-disabled="true">Order a print <small>soon</small></a>
          <p class="note">{{NOTE}}</p>
        </div>
      </section>

      <div id="rotate-cue" class="cue" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <rect class="phone" x="20" y="6" width="24" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="2.5" />
          <circle cx="32" cy="51" r="2" fill="currentColor" />
        </svg>
        <span>ROTATE YOUR PHONE</span>
      </div>
      <div id="zoom-cue" class="cue" aria-hidden="true"><span>ZOOM IN</span></div>
      <div id="error" role="alert"></div>
    </main>
    <script>
      window.SITE = /*SITE*/ {};
    </script>
    <script src="vendor/openseadragon.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
